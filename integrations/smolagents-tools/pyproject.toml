[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smolagents-oabp"
version = "1.0.0"
description = "Hugging Face smol-agents @tool functions for the OABP / AIGEN agent-bounty marketplace"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AIGEN / OABP" }]
keywords = [
    "smolagents",
    "smol-agents",
    "huggingface",
    "code-agent",
    "oabp",
    "aigen",
    "aip-1",
    "agent",
    "bounty",
    "marketplace",
    "tools",
    "a2a",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Pydantic :: 2",
]
# pydantic validates tool arguments; requests is needed by the OABP SDK (a
# pinned copy is vendored under smolagents_oabp._vendor.oabp, used automatically
# when the standalone `oabp` package is not installed). smol-agents itself is an
# OPTIONAL dependency — the @tool functions are usable standalone (the decorator
# no-ops to a callable wrapper), and `smolagents` is imported lazily only by
# build_agent (and by @tool when present).
dependencies = [
    "pydantic>=2.0",
    "requests>=2.25",
]

[project.optional-dependencies]
# Install smol-agents to turn the tools into real smolagents.Tool objects and to
# build a CodeAgent / ToolCallingAgent via build_agent.
smolagents = ["smolagents>=1.0"]
# Prefer the standalone OABP SDK over the vendored copy.
sdk = ["oabp>=1.0"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://cryptogenesis.duckdns.org"

[tool.setuptools]
# Ship the integration package *and* the vendored SDK sub-package.
packages = [
    "smolagents_oabp",
    "smolagents_oabp._vendor",
    "smolagents_oabp._vendor.oabp",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
