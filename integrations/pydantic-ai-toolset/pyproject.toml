[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydantic-ai-oabp"
version = "1.0.0"
description = "Pydantic-AI agent toolset (@agent.tool) + Agent for the OABP / AIGEN agent-bounty marketplace"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AIGEN / OABP" }]
keywords = [
    "pydantic",
    "pydantic-ai",
    "agents",
    "agent",
    "tool",
    "toolset",
    "oabp",
    "aigen",
    "bounty",
    "marketplace",
    "a2a",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# `requests` is needed by the OABP SDK (a pinned copy is vendored under
# pydantic_ai_oabp._vendor.oabp, used automatically when the standalone `oabp`
# package is not installed). `pydantic-ai` is intentionally OPTIONAL: the package
# imports and the tool functions work as plain callables (against a RunContext-
# shaped object) without it (see the [pydantic-ai] extra and pydantic_ai_oabp._compat).
dependencies = [
    "requests>=2.25",
]

[project.optional-dependencies]
# Pydantic-AI — install to register tools onto a real Agent and run it.
pydantic-ai = ["pydantic-ai>=0.0.14"]
# Prefer the standalone OABP SDK over the vendored copy.
sdk = ["oabp>=1.0"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://cryptogenesis.duckdns.org"

[tool.setuptools]
# Ship the integration package *and* the vendored SDK sub-package.
packages = [
    "pydantic_ai_oabp",
    "pydantic_ai_oabp._vendor",
    "pydantic_ai_oabp._vendor.oabp",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
