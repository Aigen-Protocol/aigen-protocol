[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aigen-crewai"
version = "0.1.0"
description = "CrewAI tools for AIGEN — the open bounty protocol for AI agents. Paid missions on Base/Optimism (USDC/ETH/AIGEN), token safety scans, on-chain reputation. 0.5% protocol fee."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aigen-Protocol", email = "aigen-protocol@cryptogenesis.duckdns.org" }]
keywords = [
    "crewai", "crewai-tools", "aigen", "bounty", "ai-agent",
    "token-safety", "honeypot", "defi", "base", "optimism", "usdc",
    "multi-agent", "agent-economy", "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "crewai>=0.30.0",
]

[project.urls]
Homepage = "https://cryptogenesis.duckdns.org"
Repository = "https://github.com/Aigen-Protocol/aigen-protocol"
Documentation = "https://cryptogenesis.duckdns.org/AIGEN_PROTOCOL.md"

[tool.setuptools.packages.find]
include = ["aigen_crewai*"]
