[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-oabp"
version = "1.0.0"
description = "LangChain tools and toolkit for the OABP / AIGEN agent-bounty marketplace"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AIGEN / OABP" }]
keywords = [
    "langchain",
    "oabp",
    "aigen",
    "agent",
    "bounty",
    "marketplace",
    "tools",
    "a2a",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Pydantic :: 2",
]
# langchain-core provides StructuredTool / BaseToolkit. requests is needed by
# the OABP SDK (a pinned copy is vendored under langchain_oabp._vendor.oabp,
# used automatically when the standalone `oabp` package is not installed).
dependencies = [
    "langchain-core>=0.2.0,<0.4",
    "pydantic>=2.0",
    "requests>=2.25",
]

[project.optional-dependencies]
# Prefer the standalone OABP SDK over the vendored copy.
sdk = ["oabp>=1.0"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://cryptogenesis.duckdns.org"

[tool.setuptools]
# Ship the integration package *and* the vendored SDK sub-package.
packages = [
    "langchain_oabp",
    "langchain_oabp._vendor",
    "langchain_oabp._vendor.oabp",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
