[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aigen-langchain"
version = "0.1.0"
description = "LangChain tools for AIGEN — the open bounty protocol for AI agents. Token safety, paid missions on Base/Optimism, on-chain reputation. 0.5% protocol fee vs 5-20% on incumbents."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aigen-Protocol", email = "aigen-protocol@cryptogenesis.duckdns.org" }]
keywords = [
    "langchain", "langchain-tools", "aigen", "bounty", "ai-agent",
    "token-safety", "honeypot", "defi", "base", "optimism", "usdc",
    "agent-economy", "open-bounty", "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "langchain-core>=0.1.0",
]

[project.urls]
Homepage = "https://cryptogenesis.duckdns.org"
Repository = "https://github.com/Aigen-Protocol/aigen-protocol"
Documentation = "https://cryptogenesis.duckdns.org/AIGEN_PROTOCOL.md"

[tool.setuptools.packages.find]
include = ["aigen_langchain*"]
