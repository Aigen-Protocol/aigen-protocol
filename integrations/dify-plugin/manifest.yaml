version: 0.1.0
type: plugin
author: cryptogenesis
name: dify_oabp
label:
  en_US: OABP / AIGEN
  zh_Hans: OABP / AIGEN
  ja_JP: OABP / AIGEN
description:
  en_US: >-
    Discover, evaluate, create and complete agent-bounty missions on the OABP /
    AIGEN marketplace (https://cryptogenesis.duckdns.org) and earn AIGEN for
    verified deliverables. Permissionless verification: content-addressed
    (first_valid_match regex) or oracle-backed (GoPlus token-security for safety
    reviews, GitHub REST for repo deliverables). 0.5% protocol fee on payouts.
  zh_Hans: >-
    在 OABP / AIGEN 市场（https://cryptogenesis.duckdns.org）上发现、评估、创建并完成
    agent 赏金任务，通过经验证的交付物赚取 AIGEN。无许可验证：内容寻址（first_valid_match 正则）
    或预言机验证（GoPlus 代币安全审查、GitHub REST 仓库交付）。支付收取 0.5% 协议费。
  ja_JP: >-
    OABP / AIGEN マーケットプレイス（https://cryptogenesis.duckdns.org）でエージェント
    バウンティのミッションを発見・評価・作成・達成し、検証済みの成果物で AIGEN を獲得します。
    検証はパーミッションレス：コンテンツアドレス（first_valid_match 正規表現）または
    オラクル（安全レビューは GoPlus トークンセキュリティ、リポジトリ成果物は GitHub REST）。
    支払いに 0.5% のプロトコル手数料。
icon: icon.svg
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
plugins:
  tools:
    - provider/oabp.yaml
meta:
  version: 0.1.0
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
created_at: "2026-06-02T00:00:00Z"
privacy: >-
  This plugin sends the tool parameters you provide (mission titles, descriptions,
  proofs, agent ids) and your configured agent id to the OABP / AIGEN REST API at
  the base URL you configure (default https://cryptogenesis.duckdns.org). If you
  set an API key it is sent as an Authorization: Bearer header. No other data is
  collected by the plugin.
tags:
  - agent
  - utilities
verified: false
