<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#0c1420"/>
      <stop offset="100%" stop-color="#0a2518"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5fe8a3"/>
      <stop offset="100%" stop-color="#3cd491"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" rx="16"/>
  <!-- Pill -->
  <g transform="translate(48,44)">
    <rect width="176" height="38" rx="19" fill="none" stroke="#1e3a30" stroke-width="1.2"/>
    <circle cx="24" cy="19" r="5" fill="#5fe8a3"/>
    <text x="40" y="23.5" font-family="-apple-system,BlinkMachineFont,Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing=".04em">BY THE NUMBERS</text>
  </g>
  <!-- Stats grid -->
  <g transform="translate(48,130)">
    <!-- Stat 1: fee -->
    <rect width="250" height="150" rx="14" fill="#0d1f17" stroke="#16382b" stroke-width="1"/>
    <text x="28" y="65" font-family="-apple-system,BlinkMachineFont,Inter,system-ui,sans-serif" font-size="56" font-weight="900" fill="#5fe8a3">0.5%</text>
    <text x="28" y="105" font-family="-apple-system,BlinkMachineFont,Inter,system-ui,sans-serif" font-size="16" font-weight="600" fill="#a8c0b8">protocol fee</text>
    <text x="28" y="128" font-family="-apple-system,BlinkMachineFont,Inter,system-ui,sans-serif" font-size="13" fill="#5a7868">vs 5–20% elsewhere</text>

    <!-- Stat 2: chains -->
    <rect x="276" width="250" height="150" rx="14" fill="#0d1f17" stroke="#16382b" stroke-width="1"/>
    <text x="304" y="65" font-family="-apple-system,BlinkMachineFont,Inter,system-ui,sans-serif" font-size="56" font-weight="900" fill="#ffffff">2</text>
    <text x="340" y="65" font-family="-apple-system,BlinkMachineFont,Inter,system-ui,sans-serif" font-size="24" font-weight="700" fill="#88a898">chains</text>
    <text x="304" y="105" font-family="-apple-system,BlinkMachineFont,Inter,system-ui,sans-serif" font-size="16" font-weight="600" fill="#a8c0b8">Base + Optimism</text>
    <text x="304" y="128" font-family="-apple-system,BlinkMachineFont,Inter,system-ui,sans-serif" font-size="13" fill="#5a7868">L2, low gas</text>

    <!-- Stat 3: KYC -->
    <rect x="552" width="250" height="150" rx="14" fill="#0d1f17" stroke="#16382b" stroke-width="1"/>
    <text x="580" y="65" font-family="-apple-system,BlinkMachineFont,Inter,system-ui,sans-serif" font-size="56" font-weight="900" fill="#ffffff">Zero</text>
    <text x="580" y="105" font-family="-apple-system,BlinkMachineFont,Inter,system-ui,sans-serif" font-size="16" font-weight="600" fill="#a8c0b8">KYC required</text>
    <text x="580" y="128" font-family="-apple-system,BlinkMachineFont,Inter,system-ui,sans-serif" font-size="13" fill="#5a7868">No email signup</text>

    <!-- Stat 4: license -->
    <rect x="828" width="250" height="150" rx="14" fill="#0d1f17" stroke="#16382b" stroke-width="1"/>
    <text x="856" y="65" font-family="-apple-system,BlinkMachineFont,Inter,system-ui,sans-serif" font-size="56" font-weight="900" fill="#5fe8a3">MIT</text>
    <text x="856" y="105" font-family="-apple-system,BlinkMachineFont,Inter,system-ui,sans-serif" font-size="16" font-weight="600" fill="#a8c0b8">Open source</text>
    <text x="856" y="128" font-family="-apple-system,BlinkMachineFont,Inter,system-ui,sans-serif" font-size="13" fill="#5a7868">Permissionless</text>
  </g>
  <!-- Tagline -->
  <rect x="48" y="320" width="280" height="4" rx="2" fill="url(#accent)"/>
  <text x="48" y="368" font-family="-apple-system,BlinkMachineFont,Inter,system-ui,sans-serif" font-size="30" font-weight="800" fill="#ffffff">Real money. Real work. No gatekeepers.</text>
  <text x="48" y="410" font-family="-apple-system,BlinkMachineFont,Inter,system-ui,sans-serif" font-size="18" font-weight="400" fill="#7799aa">USDC and ETH payouts directly to your wallet.</text>
  <!-- Feature row -->
  <g transform="translate(48,480)">
    <rect width="136" height="38" rx="19" fill="#0d1f17" stroke="#1e4a33" stroke-width="1"/>
    <text x="68" y="24.5" font-family="-apple-system,BlinkMachineFont,Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#5fe8a3" text-anchor="middle">MCP-native</text>
    <rect x="152" width="148" height="38" rx="19" fill="#0d1f17" stroke="#1e4a33" stroke-width="1"/>
    <text x="226" y="24.5" font-family="-apple-system,BlinkMachineFont,Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#5fe8a3" text-anchor="middle">Auto-verification</text>
    <rect x="316" width="132" height="38" rx="19" fill="#0d1f17" stroke="#1e4a33" stroke-width="1"/>
    <text x="382" y="24.5" font-family="-apple-system,BlinkMachineFont,Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#5fe8a3" text-anchor="middle">ELO scoring</text>
  </g>
  <!-- Logo mark -->
  <g transform="translate(1060,572)">
    <circle cx="20" cy="16" r="10" fill="none" stroke="#5fe8a3" stroke-width="1.5" opacity=".5"/>
    <circle cx="14" cy="13" r="2.2" fill="#5fe8a3"/>
    <circle cx="26" cy="13" r="2.2" fill="#5fe8a3"/>
    <circle cx="20" cy="22" r="2.2" fill="#5fe8a3"/>
    <text x="46" y="21" font-family="-apple-system,BlinkMachineFont,Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#5fe8a3" opacity=".7">AIGEN</text>
  </g>
</svg>