<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#0c1420"/>
      <stop offset="100%" stop-color="#0a2518"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5fe8a3"/>
      <stop offset="100%" stop-color="#3cd491"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" rx="16"/>
  <!-- Top pill -->
  <g transform="translate(48,44)">
    <rect width="220" height="38" rx="19" fill="none" stroke="#1e3a30" stroke-width="1.2"/>
    <circle cx="24" cy="19" r="5" fill="#5fe8a3"/>
    <text x="40" y="23.5" font-family="-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing=".04em">LIVE · Base + Optimism</text>
  </g>
