    <text x="65" y="21" font-family="-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#5fe8a3" text-anchor="middle" letter-spacing=".03em">MCP-NATIVE</text>
    <rect x="142" y="0" width="90" height="32" rx="16" fill="#0d1f17" stroke="#1e4a33" stroke-width="1"/>
    <text x="187" y="21" font-family="-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">MIT LICENSE</text>
