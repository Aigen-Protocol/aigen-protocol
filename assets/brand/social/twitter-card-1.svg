  <!-- Small logo mark bottom-right -->
  <g transform="translate(1080,570)">
    <circle cx="20" cy="16" r="10" fill="none" stroke="#5fe8a3" stroke-width="1.5" opacity=".5"/>
    <circle cx="14" cy="13" r="2.2" fill="#5fe8a3"/>
    <circle cx="26" cy="13" r="2.2" fill="#5fe8a3"/>
    <circle cx="20" cy="22" r="2.2" fill="#5fe8a3"/>
