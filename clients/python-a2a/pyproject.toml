[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oabp-a2a"
version = "0.1.0"
description = "Python client for the OABP / AIGEN A2A JSON-RPC API with ES256 agent-card verification"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "OABP community" }]
keywords = ["oabp", "aigen", "a2a", "json-rpc", "agent-card", "jws", "es256"]
dependencies = [
    "requests>=2.25",
    "cryptography>=3.4",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4"]

[project.urls]
Homepage = "https://cryptogenesis.duckdns.org"

[tool.setuptools]
packages = ["oabp_a2a"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
