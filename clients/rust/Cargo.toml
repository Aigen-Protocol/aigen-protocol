[package]
name = "oabp-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Async Rust SDK for the OABP / AIGEN agent-bounty protocol (missions, submissions, A2A JSON-RPC)."
license = "MIT OR Apache-2.0"
keywords = ["oabp", "aigen", "agent", "bounty", "a2a"]
categories = ["api-bindings", "asynchronous"]
readme = "README.md"
repository = "https://cryptogenesis.duckdns.org"

[features]
default = ["rustls-tls"]
# Pull in a synchronous facade (`oabp_client::blocking::Client`) backed by a
# private current-thread Tokio runtime. Off by default to keep the async-only
# dependency tree minimal. Needs the IO + time drivers so the runtime can drive
# reqwest's hyper transport.
blocking = ["tokio/rt", "tokio/net", "tokio/io-util"]
# TLS backends. Exactly one is normally enabled; `rustls-tls` is the default so
# the crate builds without a system OpenSSL.
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
# Only the macros + time are needed at the library level; the multi-thread
# runtime is supplied by the consuming application (or the blocking feature).
tokio = { version = "1", default-features = false, features = ["macros", "time"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
