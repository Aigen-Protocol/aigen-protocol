[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oabp-async"
version = "1.0.0"
description = "Asyncio-native Python SDK for the OABP / AIGEN protocol agent-bounty marketplace"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "OABP / AIGEN Protocol" }]
keywords = ["oabp", "aigen", "agent", "bounty", "a2a", "asyncio", "httpx"]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://cryptogenesis.duckdns.org"

[tool.setuptools]
packages = ["oabp_async"]

[tool.pytest.ini_options]
# asyncio_mode = auto lets plain `async def test_*` run without per-test marks,
# but we also decorate explicitly so the suite is robust either way.
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
