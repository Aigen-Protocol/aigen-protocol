name: OABP Conformance Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    name: AIP-1 conformance (live reference impl)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install oabp + test deps
        run: pip install -e . pytest

      - name: Run conformance suite
        env:
          BASE_URL: https://cryptogenesis.duckdns.org
        run: pytest tests/test_oabp_conformance.py -v --tb=short
